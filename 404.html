<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · Página no encontrada · Pancho en la Red</title>
<meta name="description" content="Página no encontrada. Vuelve a la página principal de Pancho en la Red." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Rajdhani', system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a14 60%, #000 100%);
    color: #eaeaf5;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* animated stars background */
  .stars, .stars::before, .stars::after {
    position: absolute; inset: 0;
    background-repeat: repeat;
    pointer-events: none;
  }
  .stars {
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 80%, #fff, transparent),
      radial-gradient(2px 2px at 90% 50%, #fff, transparent),
      radial-gradient(1px 1px at 10% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 50% 10%, #fff, transparent),
      radial-gradient(1px 1px at 70% 90%, #fff, transparent);
    background-size: 600px 600px;
    opacity: .35;
    animation: drift 90s linear infinite;
    z-index: 0;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to   { background-position: 600px 600px; }
  }

  .glow {
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255, 90, 160, .18) 0%, transparent 70%);
    top: 20%; left: 50%;
    transform: translateX(-50%);
    filter: blur(40px);
    z-index: 0;
    pointer-events: none;
    animation: pulse 6s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { opacity: .6; transform: translateX(-50%) scale(.95); }
    to   { opacity: 1;  transform: translateX(-50%) scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 720px;
  }

  .code {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(7rem, 22vw, 14rem);
    line-height: 1;
    background: linear-gradient(135deg, #ff5aa0 0%, #ffb347 50%, #5ad7ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: .04em;
    text-shadow: 0 0 60px rgba(255, 90, 160, .35);
    animation: float 4s ease-in-out infinite alternate;
  }
  @keyframes float {
    from { transform: translateY(-6px); }
    to   { transform: translateY(6px); }
  }

  .label {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(.9rem, 2vw, 1.1rem);
    letter-spacing: .5em;
    color: #ffb347;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: .85;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 4.5vw, 2.8rem);
    margin: 28px 0 14px;
    color: #fff;
    letter-spacing: .02em;
  }

  p.lead {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: #c8c8e0;
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 38px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-decoration: none;
    color: #0a0a14;
    background: linear-gradient(135deg, #ff5aa0 0%, #ffb347 100%);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(255, 90, 160, .35);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px rgba(255, 90, 160, .5);
    filter: brightness(1.05);
  }
  .btn:active { transform: translateY(-1px); }

  .footer {
    margin-top: 50px;
    font-size: .85rem;
    color: #888;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .footer a {
    color: #ffb347;
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="container">
    <div class="code">404</div>
    <div class="label">Página no encontrada</div>
    <h1>¿Te has perdido?</h1>
    <p class="lead">
      La página que buscas no existe o fue movida.<br/>
      Vuelve a la página principal y descubre nuestros próximos eventos.
    </p>
    <a class="btn" href="/">← Volver al inicio</a>

    <div class="footer">
      <a href="https://t.me/panchoenlared" target="_blank" rel="noopener">@panchoenlared</a>
      &nbsp;·&nbsp; Pancho en la Red
    </div>
  </main>
</body>
</html>
